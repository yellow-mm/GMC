<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add / Edit Project</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f7f7fb; margin: 0; padding: 20px; color: #1f2937; }
    .container { width: 100%; max-width: 900px; margin: auto; background: #fff; padding: 24px; border-radius: 18px; box-shadow: 0 6px 18px rgba(15,23,42,0.06); }
    .header { background: linear-gradient(135deg, #ddd6fe, #bfdbfe); border-radius: 18px; padding: 22px; margin-bottom: 24px; }
    .header h1 { margin: 0; font-size: 26px; color: #1e3a8a; }
    .header p  { margin: 6px 0 0 0; color: #475569; font-size: 14px; }
    .back-link { display: inline-block; margin-bottom: 18px; text-decoration: none; color: #2563eb; font-weight: bold; font-size: 14px; }
    .card { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 16px; padding: 20px; }
    .section-label { font-size: 13px; font-weight: bold; color: #6366f1; text-transform: uppercase; letter-spacing: 0.05em; margin: 20px 0 10px 0; padding-bottom: 6px; border-bottom: 1px solid #e0e7ff; }
    .form-group { display: flex; flex-direction: column; margin-bottom: 16px; }
    label { font-size: 14px; font-weight: bold; margin-bottom: 6px; color: #374151; }
    label .required { color: #ef4444; margin-left: 2px; }
    label .hint { font-weight: normal; font-size: 12px; color: #94a3b8; margin-left: 6px; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; background: #fff; font-family: Arial, sans-serif; }
    textarea { resize: vertical; min-height: 110px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }

    /* Engineer tags */
    .engineer-box {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 48px;
      cursor: text;
    }
    .engineer-box:focus-within { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.15); }
    .engineer-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #dbeafe;
      color: #1e40af;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .engineer-tag button {
      background: none;
      border: none;
      color: #1e40af;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      margin: 0;
      border-radius: 0;
    }
    .engineer-tag button:hover { color: #ef4444; opacity: 1; }
    .engineer-input {
      border: none !important;
      outline: none !important;
      padding: 4px 6px !important;
      font-size: 14px;
      min-width: 140px;
      flex: 1;
      background: transparent !important;
      box-shadow: none !important;
    }

    .due-date-wrapper { position: relative; }
    .due-date-wrapper input[type="datetime-local"] { padding-right: 38px; }
    .due-date-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; pointer-events: none; }
    .line-info { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    .line-info .badge { background: #06c755; color: #fff; font-weight: bold; font-size: 13px; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .line-info p { margin: 0; color: #166534; font-size: 13px; }
    .button-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    button, .cancel-link { border: none; border-radius: 10px; padding: 12px 18px; font-size: 14px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
    .save-btn { background: #2563eb; color: #fff; }
    .cancel-link { background: #e5e7eb; color: #374151; }
    button:hover, .cancel-link:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-message { margin-top: 12px; color: #64748b; font-size: 14px; }
    .hint-text { font-size: 12px; color: #94a3b8; margin-top: 5px; }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .container { padding: 16px; border-radius: 14px; }
      .header { padding: 18px; }
      .header h1 { font-size: 22px; }
      button, .cancel-link { width: 100%; text-align: center; }
      .button-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back-link" href="index.html">← Back to Dashboard</a>

    <div class="header">
      <h1 id="pageTitle">Add Work</h1>
      <p>Add or edit project / task information</p>
    </div>

    <div class="card">

      <div class="section-label">📋 Work Information</div>

      <!-- Engineer Name — multi tag input -->
      <div class="form-group">
        <label>Engineer Name <span class="required">*</span></label>
        <div class="engineer-box" id="engineerBox" onclick="document.getElementById('engineerInput').focus()">
          <input
            type="text"
            id="engineerInput"
            class="engineer-input"
            placeholder="Type name then press Enter or ,"
          />
        </div>
        <div class="hint-text">Press Enter or , to add — multiple engineers allowed</div>
      </div>

      <div class="form-group">
        <label for="customer">Customer <span class="required">*</span></label>
        <input type="text" id="customer" placeholder="e.g. PICO Thailand" />
      </div>

      <div class="form-group">
        <label for="projectType">Type <span class="required">*</span></label>
        <select id="projectType">
          <option value="">-- Select Type --</option>
          <option value="Project">Project</option>
          <option value="Task">Task</option>
          <option value="PM">PM (Preventive Maintenance)</option>
          <option value="ETC">ETC</option>
        </select>
      </div>

      <div class="form-group">
        <label for="projectName">Name <span class="required">*</span></label>
        <input type="text" id="projectName" placeholder="e.g. Firewall Replacement / Install Switch / PM Server" />
      </div>

      <div class="form-group">
        <label for="detail">Detail <span class="hint">(Job details — will appear in notifications)</span></label>
        <textarea id="detail" style="min-height:80px" placeholder="e.g. Install Firewall PA-440 with Policy Config / Check PM Server 3rd Floor"></textarea>
      </div>

      <div class="form-group">
        <label for="status">Status <span class="required">*</span></label>
        <select id="status">
          <option value="">-- Select Status --</option>
          <option value="Not Start">Not Start</option>
          <option value="Inprogress">Inprogress</option>
          <option value="Onhold">Onhold</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <div class="section-label">📅 Schedule / Onsite Date</div>

      <div class="form-group">
        <label for="dueDate">Onsite Date / Appointment <span class="hint">(scheduled work date &amp; time)</span></label>
        <div class="due-date-wrapper">
          <input type="datetime-local" id="dueDate" />
          <span class="due-date-icon">📅</span>
        </div>
      </div>

      <div class="form-group">
        <label for="notifyBeforeHours">Notify Before <span class="hint">(hours before due date)</span></label>
        <select id="notifyBeforeHours">
          <option value="1">1 Hour</option>
          <option value="2">2 Hours</option>
          <option value="3">3 Hours</option>
          <option value="6">6 Hours</option>
          <option value="12">12 Hours</option>
          <option value="24" selected>24 Hours (1 Day)</option>
          <option value="48">48 Hours (2 Days)</option>
          <option value="72">72 Hours (3 Days)</option>
        </select>
      </div>

      <div class="section-label">💬 Comment</div>

      <div class="form-group">
        <label for="comment">Comment</label>
        <textarea id="comment" placeholder="Add job details / pending tasks / follow-up items"></textarea>
      </div>

      <div class="button-row">
        <button class="save-btn" id="saveButton" onclick="saveProject()">Save Project</button>
        <a class="cancel-link" href="index.html">Cancel</a>
      </div>

      <div id="statusMessage" class="status-message"></div>
    </div>
  </div>

  <script type="module">
    import { db, collectionName } from "./firebase.js";
    import {
      collection, addDoc, getDoc, getDocs, updateDoc, doc, serverTimestamp, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const urlParams     = new URLSearchParams(window.location.search);
    const projectId     = urlParams.get("id");
    let existingProject = null;
    let engineers       = []; // array of engineer names

    // ── Tag input logic ──────────────────────────────────────────────
    const engineerInput = document.getElementById("engineerInput");
    const engineerBox   = document.getElementById("engineerBox");

    function renderTags() {
      // Remove existing tags (keep the input)
      engineerBox.querySelectorAll(".engineer-tag").forEach(t => t.remove());

      engineers.forEach((name, i) => {
        const tag = document.createElement("div");
        tag.className = "engineer-tag";
        tag.innerHTML = `${escapeHtml(name)} <button type="button" onclick="removeEngineer(${i})">×</button>`;
        engineerBox.insertBefore(tag, engineerInput);
      });
    }

    function addEngineer(name) {
      const trimmed = name.trim();
      if (!trimmed) return;
      if (engineers.includes(trimmed)) return; // no duplicates
      engineers.push(trimmed);
      renderTags();
      engineerInput.value = "";
    }

    window.removeEngineer = function(index) {
      engineers.splice(index, 1);
      renderTags();
    };

    engineerInput.addEventListener("keydown", function(e) {
      if (e.key === "Enter" || e.key === ",") {
        e.preventDefault();
        addEngineer(engineerInput.value.replace(/,/g, ""));
      }
      // Backspace on empty input removes last tag
      if (e.key === "Backspace" && engineerInput.value === "" && engineers.length > 0) {
        engineers.pop();
        renderTags();
      }
    });

    engineerInput.addEventListener("blur", function() {
      if (engineerInput.value.trim()) addEngineer(engineerInput.value);
    });

    function escapeHtml(v) {
      return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ── Load for edit ────────────────────────────────────────────────
    async function loadProjectForEdit() {
      if (!projectId) return;
      document.getElementById("pageTitle").innerText  = "Edit Project";
      document.getElementById("saveButton").innerText = "Update Project";
      setStatus("Loading project...");

      try {
        const docSnap = await getDoc(doc(db, collectionName, projectId));
        if (!docSnap.exists()) {
          alert("Project not found.");
          window.location.href = "index.html";
          return;
        }

        existingProject = { id: docSnap.id, ...docSnap.data() };

        // Load engineers — support both old string and new array format
        if (Array.isArray(existingProject.engineers)) {
          engineers = [...existingProject.engineers];
        } else if (existingProject.engineerName) {
          engineers = [existingProject.engineerName];
        }
        renderTags();

        document.getElementById("projectType").value       = existingProject.projectType || "";
        document.getElementById("customer").value          = existingProject.customer || "";
        document.getElementById("projectName").value       = existingProject.projectName || "";
        document.getElementById("status").value            = existingProject.status || "";
        document.getElementById("comment").value           = "";
        document.getElementById("detail").value            = existingProject.detail || "";
        document.getElementById("notifyBeforeHours").value = existingProject.notifyBeforeHours || "24";

        if (existingProject.dueDate) {
          const d   = new Date(existingProject.dueDate);
          const pad = n => String(n).padStart(2, "0");
          document.getElementById("dueDate").value =
            `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        setStatus("Project loaded.");
      } catch (error) {
        console.error(error);
        setStatus("Cannot load project.");
      }
    }

    // ── Save ─────────────────────────────────────────────────────────
    async function saveProject() {
      // Flush any partially typed name in the input
      if (engineerInput.value.trim()) addEngineer(engineerInput.value);

      const projectType       = document.getElementById("projectType").value;
      const customer          = document.getElementById("customer").value.trim();
      const projectName       = document.getElementById("projectName").value.trim();
      const status            = document.getElementById("status").value;
      const commentText       = document.getElementById("comment").value.trim();
      const detail            = document.getElementById("detail").value.trim();
      const notifyBeforeHours = parseInt(document.getElementById("notifyBeforeHours").value) || 24;
      const dueDateValue      = document.getElementById("dueDate").value;

      if (engineers.length === 0 || !projectType || !customer || !projectName || !status) {
        alert("Please fill in at least 1 Engineer Name, Type, Name, Customer, and Status.");
        return;
      }

      const saveButton    = document.getElementById("saveButton");
      saveButton.disabled = true;

      const currentTime   = getCurrentTimeText();
      const dueDateISO    = dueDateValue ? new Date(dueDateValue).toISOString() : null;
      const dueDateText   = dueDateValue
        ? new Date(dueDateValue).toLocaleString("en-GB", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" })
        : null;

      // engineerName (string) = joined for backward compat display
      const engineerName  = engineers.join(", ");

      try {
        if (!projectId) {
          // Generate task number
          const allDocs = await getDocs(collection(db, collectionName));
          const nextNum = allDocs.size + 1;
          const taskNumber = `GMC-${String(nextNum).padStart(3, "0")}`;

          const comments = commentText ? [{ text: commentText, createdAtText: currentTime }] : [];
          await addDoc(collection(db, collectionName), {
            taskNumber,
            engineers,        // array — new field
            engineerName,     // string — backward compat
            projectType, customer, projectName, detail, status, comments,
            dueDate: dueDateISO, dueDateText, notifyBeforeHours,
            notified: false,
            createdTimeText: currentTime, updatedTimeText: currentTime,
            createdAt: serverTimestamp(), updatedAt: serverTimestamp()
          });
          setStatus("Project added successfully.");
        } else {
          const existingComments = Array.isArray(existingProject?.comments) ? existingProject.comments : [];
          const updatedComments  = [...existingComments];
          if (commentText) updatedComments.push({ text: commentText, createdAtText: currentTime });

          await updateDoc(doc(db, collectionName, projectId), {
            engineers, engineerName,
            projectType, customer, projectName, detail, status,
            comments: updatedComments,
            dueDate: dueDateISO, dueDateText, notifyBeforeHours,
            notified: false,
            updatedTimeText: currentTime, updatedAt: serverTimestamp()
          });
          setStatus("Project updated successfully.");
        }

        setTimeout(() => { window.location.href = "index.html"; }, 600);
      } catch (error) {
        console.error(error);
        alert("Cannot save data. Please check Firebase / Firestore Rules.");
        setStatus("Error saving project.");
      } finally {
        saveButton.disabled = false;
      }
    }

    function getCurrentTimeText() {
      return new Date().toLocaleString("en-GB", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
    }

    function setStatus(msg) { document.getElementById("statusMessage").innerText = msg; }

    window.saveProject = saveProject;
    loadProjectForEdit();
  </script>
</body>
</html>
