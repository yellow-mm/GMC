<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Tracker Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f7f7fb; margin: 0; padding: 20px; color: #1f2937; }
    .container { width: 100%; max-width: 1300px; margin: auto; background: #fff; padding: 24px; border-radius: 18px; box-shadow: 0 6px 18px rgba(15,23,42,0.06); }
    .header { background: linear-gradient(135deg, #c7d2fe, #bfdbfe); border-radius: 18px; padding: 22px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .header-title h1 { margin: 0; font-size: 28px; color: #1e3a8a; }
    .header-title p  { margin: 6px 0 0 0; color: #475569; font-size: 14px; }
    .header-actions  { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .add-btn { text-decoration: none; background: #2563eb; color: #fff; padding: 12px 18px; border-radius: 10px; font-weight: bold; font-size: 14px; display: inline-block; }
    .notify-all-btn { background: #06c755; color: #fff; border: none; padding: 12px 18px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .add-btn:hover, .notify-all-btn:hover { opacity: 0.9; }
    .section { margin-bottom: 28px; }
    .section-title { font-size: 18px; font-weight: bold; color: #1e40af; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 2px solid #dbeafe; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .dashboard-card { border: 1px solid #e5e7eb; border-radius: 16px; padding: 16px; cursor: pointer; text-align: center; background: #fff; transition: 0.15s ease; }
    .dashboard-card:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(15,23,42,0.08); }
    .dashboard-card.active { border-color: #2563eb; background: #eff6ff; }
    .card-all { background: #f8fafc; } .card-not-start { background: #f3f4f6; }
    .card-inprogress { background: #dbeafe; } .card-onhold { background: #fef3c7; } .card-completed { background: #dcfce7; }
    .dashboard-title { font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 8px; }
    .dashboard-number { font-size: 30px; font-weight: bold; color: #1e40af; }
    .table-wrapper { width: 100%; overflow-x: auto; border: 1px solid #e5e7eb; border-radius: 16px; }
    table { width: 100%; min-width: 1100px; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 14px; vertical-align: top; }
    th { background: #eff6ff; color: #1e3a8a; font-weight: bold; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #f9fafb; }
    tr.due-today td { background: #fff7ed !important; border-left: 3px solid #f97316; }
    tr.due-soon td  { background: #fefce8 !important; border-left: 3px solid #eab308; }
    tr.overdue td   { background: #fef2f2 !important; border-left: 3px solid #ef4444; }
    .due-badge { display: inline-block; padding: 4px 8px; border-radius: 8px; font-size: 12px; font-weight: bold; white-space: nowrap; margin-top: 2px; }
    .due-badge-overdue { background: #fee2e2; color: #991b1b; } .due-badge-today { background: #ffedd5; color: #9a3412; }
    .due-badge-soon { background: #fef9c3; color: #713f12; } .due-badge-ok { background: #dcfce7; color: #166534; } .due-badge-none { background: #f1f5f9; color: #64748b; }
    .status-badge { display: inline-block; padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; white-space: nowrap; }
    .status-not-start { background: #e5e7eb; color: #374151; } .status-inprogress { background: #dbeafe; color: #1e40af; }
    .status-onhold { background: #fef3c7; color: #92400e; } .status-completed { background: #dcfce7; color: #166534; }
    .comment-list { max-width: 320px; }
    .comment-item { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 8px; margin-bottom: 8px; font-size: 13px; }
    .comment-time { display: block; color: #64748b; font-size: 11px; margin-top: 4px; }
    .comment-edited { display: block; color: #0f766e; font-size: 11px; margin-top: 2px; }
    .comment-action-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    textarea { width: 100%; min-height: 60px; padding: 9px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: Arial, sans-serif; font-size: 13px; resize: vertical; }
    button, .small-link { border: none; border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: bold; cursor: pointer; color: #fff; text-decoration: none; display: inline-block; margin-bottom: 6px; }
    .edit-btn { background: #f59e0b; } .delete-btn { background: #ef4444; }
    .comment-btn { background: #22c55e; margin-top: 8px; }
    .comment-edit-btn { background: #f59e0b; padding: 6px 10px; font-size: 11px; }
    .comment-delete-btn { background: #ef4444; padding: 6px 10px; font-size: 11px; }
    .line-btn { background: #06c755; } .line-btn:disabled { background: #a7f3d0; cursor: not-allowed; }
    button:hover, .small-link:hover { opacity: 0.9; }
    .empty-message { text-align: center; color: #64748b; padding: 20px; }
    .status-message { margin-top: 12px; color: #64748b; font-size: 14px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
    .legend-red { background: #ef4444; } .legend-orange { background: #f97316; } .legend-yellow { background: #eab308; }
    @media (max-width: 900px) { .dashboard-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) {
      body { padding: 12px; } .container { padding: 16px; border-radius: 14px; }
      .header { padding: 18px; } .header-title h1 { font-size: 22px; }
      .add-btn, .notify-all-btn { width: 100%; text-align: center; }
      .dashboard-grid { grid-template-columns: 1fr; } table { min-width: 1000px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="header-title">
        <h1>Project Tracker</h1>
        <p>Dashboard สำหรับติดตาม Project และงานค้าง</p>
      </div>
      <div class="header-actions">
        <button class="notify-all-btn" onclick="notifyAllDue()">🔔 Alert ทั้งหมด</button>
        <a class="add-btn" href="add.html">+ Add Project</a>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📊 Dashboard</div>
      <div class="dashboard-grid">
        <div class="dashboard-card card-all active" onclick="setFilter('All')" id="card-All">
          <div class="dashboard-title">All</div><div class="dashboard-number" id="count-All">0</div>
        </div>
        <div class="dashboard-card card-not-start" onclick="setFilter('Not Start')" id="card-Not Start">
          <div class="dashboard-title">Not Start</div><div class="dashboard-number" id="count-Not Start">0</div>
        </div>
        <div class="dashboard-card card-inprogress" onclick="setFilter('Inprogress')" id="card-Inprogress">
          <div class="dashboard-title">Inprogress</div><div class="dashboard-number" id="count-Inprogress">0</div>
        </div>
        <div class="dashboard-card card-onhold" onclick="setFilter('Onhold')" id="card-Onhold">
          <div class="dashboard-title">Onhold</div><div class="dashboard-number" id="count-Onhold">0</div>
        </div>
        <div class="dashboard-card card-completed" onclick="setFilter('Completed')" id="card-Completed">
          <div class="dashboard-title">Completed</div><div class="dashboard-number" id="count-Completed">0</div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">📋 Project List</div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot legend-red"></div> เลยกำหนดแล้ว</div>
        <div class="legend-item"><div class="legend-dot legend-orange"></div> ถึงกำหนดวันนี้ (≤8 ชม.)</div>
        <div class="legend-item"><div class="legend-dot legend-yellow"></div> ใกล้ถึงกำหนด (≤24 ชม.)</div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>No.</th><th>Engineer</th><th>Customer</th><th>Project Name</th>
              <th>Status</th><th>📅 Due Date</th><th>Comments</th><th>Updated</th><th>Action</th>
            </tr>
          </thead>
          <tbody id="projectTable">
            <tr><td colspan="9" class="empty-message">Loading data...</td></tr>
          </tbody>
        </table>
      </div>
      <div id="statusMessage" class="status-message"></div>
    </div>

  </div>

  <script type="module">
    import { db, collectionName } from "./firebase.js";
    import {
      collection, getDocs, updateDoc, deleteDoc, doc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    let projects = [];
    let currentFilter = "All";

    // ── ส่งข้อความ LINE ผ่าน Netlify Function ──────────────────────────
    async function sendLineMessage(message) {
      const res = await fetch("/.netlify/functions/line-notify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`LINE API error ${res.status}: ${text}`);
      }
      return true;
    }

    // ── สร้างข้อความแจ้งเตือน ────────────────────────────────────────
    function buildMessage(item, hoursLeft) {
      const dueTxt  = item.dueDateText || "-";
      const urgency = hoursLeft <= 0  ? "⚠️ เลยกำหนดแล้ว"
                    : hoursLeft <= 3  ? "🔴 ด่วนมาก!"
                    : hoursLeft <= 24 ? "🟡 ใกล้ถึงกำหนด"
                    :                  "📌 แจ้งเตือนล่วงหน้า";
      const timeText = hoursLeft > 0
        ? `อีก ${Math.round(hoursLeft)} ชม.`
        : `เลยกำหนดมาแล้ว ${Math.abs(Math.round(hoursLeft))} ชม.`;

      return `${urgency}\n📋 Project: ${item.projectName}\n👷 Engineer: ${item.engineerName}\n🏢 Customer: ${item.customer}\n📊 Status: ${item.status}\n📅 Due: ${dueTxt}\n⏰ ${timeText}`;
    }

    // ── ส่งแจ้งเตือนสำหรับ Project เดียว ────────────────────────────
    window.sendLineNotifyForProject = async function(projectId) {
      const item = projects.find(p => p.id === projectId);
      if (!item) return;

      const btn = document.getElementById(`line-btn-${projectId}`);
      if (btn) { btn.disabled = true; btn.innerText = "กำลังส่ง..."; }

      const hoursLeft = item.dueDate ? (new Date(item.dueDate) - new Date()) / 3600000 : 0;

      try {
        await sendLineMessage(buildMessage(item, hoursLeft));
        alert(`✅ ส่ง Alert สำเร็จ!\n${item.projectName}`);
      } catch (err) {
        alert("❌ ส่งแจ้งเตือนไม่สำเร็จ:\n" + err.message);
      } finally {
        if (btn) { btn.disabled = false; btn.innerText = "🔔 LINE"; }
      }
    };

    // ── ส่งแจ้งเตือนทุก Project ที่ถึงเกณฑ์ ─────────────────────────
    window.notifyAllDue = async function() {
      const now = new Date();
      const dueItems = projects.filter(item => {
        if (!item.dueDate || item.status === "Completed") return false;
        const h = (new Date(item.dueDate) - now) / 3600000;
        return h <= (item.notifyBeforeHours || 24);
      });

      if (dueItems.length === 0) { alert("ไม่มี Project ที่ถึงเกณฑ์แจ้งเตือนในขณะนี้"); return; }
      if (!confirm(`จะส่ง Alert สำหรับ ${dueItems.length} Project ใช่ไหม?`)) return;

      setStatus("กำลังส่ง Alert...");
      let success = 0;
      for (const item of dueItems) {
        const h = (new Date(item.dueDate) - now) / 3600000;
        try { await sendLineMessage(buildMessage(item, h)); success++; }
        catch (e) { console.error("notify failed:", item.projectName, e); }
      }
      setStatus(`ส่ง Alert สำเร็จ ${success}/${dueItems.length} รายการ`);
      alert(`✅ ส่ง Alert สำเร็จ ${success}/${dueItems.length} รายการ`);
    };

    // ── Auto-notify เมื่อเปิดหน้า ─────────────────────────────────────
    function autoCheckNotifications() {
      const now = new Date();
      projects.forEach(async item => {
        if (!item.dueDate || item.status === "Completed" || item.notified) return;
        const h = (new Date(item.dueDate) - now) / 3600000;
        const threshold = item.notifyBeforeHours || 24;
        if (h <= threshold && h > -72) {
          try {
            await sendLineMessage(buildMessage(item, h));
            await updateDoc(doc(db, collectionName, item.id), { notified: true });
          } catch (e) { console.warn("Auto-notify failed:", item.projectName); }
        }
      });
    }

    // ── โหลด Projects ─────────────────────────────────────────────────
    async function loadProjects() {
      setStatus("Loading projects...");
      try {
        const snap = await getDocs(collection(db, collectionName));
        projects = [];
        snap.forEach(d => projects.push({ id: d.id, ...d.data() }));

        projects.sort((a, b) => {
          const aH = !!a.dueDate, bH = !!b.dueDate;
          if (aH && bH) return new Date(a.dueDate) - new Date(b.dueDate);
          if (aH) return -1; if (bH) return 1;
          return (b.updatedTimeText || "").localeCompare(a.updatedTimeText || "");
        });

        updateDashboard();
        renderTable();
        setStatus("Data loaded successfully.");
        setTimeout(autoCheckNotifications, 1000);
      } catch (error) {
        console.error(error);
        setStatus("Cannot load data from Firebase.");
        document.getElementById("projectTable").innerHTML =
          `<tr><td colspan="9" class="empty-message">Cannot load data from Firebase</td></tr>`;
      }
    }

    function getUrgencyClass(dueDate, status) {
      if (!dueDate || status === "Completed") return "";
      const h = (new Date(dueDate) - new Date()) / 3600000;
      return h < 0 ? "overdue" : h <= 8 ? "due-today" : h <= 24 ? "due-soon" : "";
    }

    function getDueBadge(dueDate, dueDateText, status) {
      if (!dueDate) return `<span class="due-badge due-badge-none">ไม่ระบุ</span>`;
      const displayDate = dueDateText || new Date(dueDate).toLocaleString("th-TH", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
      if (status === "Completed") return `<div style="font-size:13px;color:#374151;margin-bottom:4px">${escapeHtml(displayDate)}</div><span class="due-badge due-badge-ok">✅ เสร็จแล้ว</span>`;
      const h = (new Date(dueDate) - new Date()) / 3600000;
      let cls, label;
      if (h < 0)        { cls = "due-badge-overdue"; label = `⛔ เลย ${Math.abs(Math.round(h))} ชม.`; }
      else if (h <= 8)  { cls = "due-badge-today";   label = `🔴 อีก ${Math.round(h)} ชม.`; }
      else if (h <= 24) { cls = "due-badge-soon";    label = `🟡 อีก ${Math.round(h)} ชม.`; }
      else              { cls = "due-badge-ok";      label = `🟢 อีก ${Math.floor(h/24)} วัน`; }
      return `<div style="font-size:13px;color:#374151;margin-bottom:4px">${escapeHtml(displayDate)}</div><span class="due-badge ${cls}">${label}</span>`;
    }

    function renderTable() {
      const tableBody = document.getElementById("projectTable");
      tableBody.innerHTML = "";
      const list = currentFilter === "All" ? projects : projects.filter(p => p.status === currentFilter);
      if (list.length === 0) { tableBody.innerHTML = `<tr><td colspan="9" class="empty-message">ไม่พบข้อมูลในสถานะนี้</td></tr>`; return; }

      list.forEach((item, index) => {
        const comments = Array.isArray(item.comments) ? item.comments : [];
        const cid      = `comment-${item.id}`;
        const urg      = getUrgencyClass(item.dueDate, item.status);

        const commentHtml = comments.length === 0
          ? `<div class="empty-message" style="padding:6px">No comment</div>`
          : comments.map((c, ci) => `
              <div class="comment-item">${escapeHtml(c.text||"")}
                <span class="comment-time">${escapeHtml(c.createdAtText||"")}</span>
                ${c.editedAtText ? `<span class="comment-edited">Edited: ${escapeHtml(c.editedAtText)}</span>` : ""}
                <div class="comment-action-row">
                  <button class="comment-edit-btn" onclick="editComment('${item.id}',${ci})">Edit</button>
                  <button class="comment-delete-btn" onclick="deleteComment('${item.id}',${ci})">Delete</button>
                </div>
              </div>`).join("");

        tableBody.innerHTML += `
          <tr class="${urg}">
            <td>${index+1}</td>
            <td>${getEngineerBadges(item)}</td>
            <td>${escapeHtml(item.customer||"")}</td>
            <td>${escapeHtml(item.projectName||"")}</td>
            <td>${getStatusBadge(item.status||"")}</td>
            <td style="min-width:160px">${getDueBadge(item.dueDate, item.dueDateText, item.status)}</td>
            <td>
              <div class="comment-list">
                ${commentHtml}
                <textarea id="${cid}" placeholder="Add comment..."></textarea>
                <button class="comment-btn" onclick="addComment('${item.id}','${cid}')">Add Comment</button>
              </div>
            </td>
            <td style="white-space:nowrap">${escapeHtml(item.updatedTimeText||"")}</td>
            <td style="white-space:nowrap">
              <a class="small-link edit-btn" href="add.html?id=${item.id}">✏️ Edit</a>
              <button id="line-btn-${item.id}" class="line-btn" onclick="sendLineNotifyForProject('${item.id}')">🔔 Alert</button>
              <button class="delete-btn" onclick="deleteProject('${item.id}')">🗑️ Delete</button>
            </td>
          </tr>`;
      });
    }

    function updateDashboard() {
      ["All","Not Start","Inprogress","Onhold","Completed"].forEach(s => {
        const count = s === "All" ? projects.length : projects.filter(p => p.status === s).length;
        const el = document.getElementById(`count-${s}`);
        if (el) el.innerText = count;
      });
    }

    function setFilter(status) {
      currentFilter = status;
      ["All","Not Start","Inprogress","Onhold","Completed"].forEach(s => {
        const c = document.getElementById(`card-${s}`); if (c) c.classList.remove("active");
      });
      const a = document.getElementById(`card-${status}`); if (a) a.classList.add("active");
      renderTable();
    }

    async function addComment(projectId, textareaId) {
      const textarea = document.getElementById(textareaId);
      const text     = textarea.value.trim();
      if (!text) { alert("กรุณาใส่ Comment ก่อน"); return; }
      const item = projects.find(p => p.id === projectId); if (!item) return;
      const now  = getCurrentTimeText();
      const updated = [...(Array.isArray(item.comments) ? item.comments : []), { text, createdAtText: now }];
      try {
        await updateDoc(doc(db, collectionName, projectId), { comments: updated, updatedTimeText: now, updatedAt: serverTimestamp() });
        textarea.value = ""; setStatus("Comment added."); await loadProjects();
      } catch (e) { alert("ไม่สามารถเพิ่ม Comment ได้"); }
    }

    async function editComment(projectId, ci) {
      const item = projects.find(p => p.id === projectId); if (!item) return;
      const comments = Array.isArray(item.comments) ? item.comments : [];
      const newText  = prompt("แก้ไข Comment:", comments[ci]?.text || "");
      if (newText === null) return;
      const trimmed = newText.trim(); if (!trimmed) { alert("Comment ห้ามว่าง"); return; }
      const now     = getCurrentTimeText();
      const updated = comments.map((c, i) => i === ci ? { ...c, text: trimmed, editedAtText: now } : c);
      try {
        await updateDoc(doc(db, collectionName, projectId), { comments: updated, updatedTimeText: now, updatedAt: serverTimestamp() });
        setStatus("Comment updated."); await loadProjects();
      } catch (e) { alert("ไม่สามารถแก้ไข Comment ได้"); }
    }

    async function deleteComment(projectId, ci) {
      const item = projects.find(p => p.id === projectId); if (!item) return;
      if (!confirm("ต้องการลบ Comment นี้ใช่ไหม?")) return;
      const comments = Array.isArray(item.comments) ? item.comments : [];
      const now      = getCurrentTimeText();
      const updated  = comments.filter((_, i) => i !== ci);
      try {
        await updateDoc(doc(db, collectionName, projectId), { comments: updated, updatedTimeText: now, updatedAt: serverTimestamp() });
        setStatus("Comment deleted."); await loadProjects();
      } catch (e) { alert("ไม่สามารถลบ Comment ได้"); }
    }

    async function deleteProject(projectId) {
      if (!confirm("ต้องการลบ Project นี้ใช่ไหม?")) return;
      try { await deleteDoc(doc(db, collectionName, projectId)); setStatus("Project deleted."); await loadProjects(); }
      catch (e) { alert("ไม่สามารถลบ Project ได้"); }
    }

    function getEngineerBadges(item) {
      const list = Array.isArray(item.engineers) && item.engineers.length > 0
        ? item.engineers
        : (item.engineerName ? item.engineerName.split(",").map(s => s.trim()) : ["-"]);
      return list.map(name =>
        `<span style="display:inline-block;background:#dbeafe;color:#1e40af;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:bold;margin:2px 2px 2px 0;white-space:nowrap">${escapeHtml(name)}</span>`
      ).join("");
    }

    function getStatusBadge(s) {
      const map = { "Not Start":"status-not-start", "Inprogress":"status-inprogress", "Onhold":"status-onhold", "Completed":"status-completed" };
      return `<span class="status-badge ${map[s]||''}">${escapeHtml(s)}</span>`;
    }

    function getCurrentTimeText() {
      return new Date().toLocaleString("th-TH", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
    }

    function setStatus(msg) { document.getElementById("statusMessage").innerText = msg; }

    function escapeHtml(v) {
      return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    window.setFilter = setFilter; window.addComment = addComment;
    window.editComment = editComment; window.deleteComment = deleteComment; window.deleteProject = deleteProject;

    loadProjects();
  </script>
</body>
</html>
