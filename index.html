<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Tracker Dashboard</title>
  <style>
    /* ── Palette: Soft Grey · Light Blue · Navy · Pale Yellow ── */
    :root {
      --bg:          #f2f5f9;
      --surface:     #ffffff;
      --border:      #dce3ed;
      --border-soft: #eaeff5;

      --navy:        #1e3a5f;
      --navy-hover:  #162d4a;
      --blue:        #3b6fce;
      --blue-light:  #eaf1fd;
      --blue-mid:    #c2d7f7;

      --grey-50:     #f7f9fc;
      --grey-100:    #f2f5f9;
      --grey-200:    #e5eaf3;
      --grey-300:    #cdd5e4;
      --grey-400:    #a0b0c8;
      --grey-500:    #728aaa;
      --grey-700:    #3d5068;

      --yellow:      #e8b800;
      --yellow-soft: #fdf8e6;
      --yellow-mid:  #f5e090;
      --yellow-dark: #7a5c00;

      --red-soft:    #fdecea;
      --red-mid:     #f2b8b2;
      --red-dark:    #8b2318;

      --green-soft:  #eaf6ef;
      --green-mid:   #aed8bb;
      --green-dark:  #2d6a4f;

      --text-main:   #1c2d3e;
      --text-sub:    #52687e;
      --text-muted:  #94a8be;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      padding: 24px;
      color: var(--text-main);
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Container ── */
    .container {
      width: 100%;
      max-width: 1340px;
      margin: auto;
      background: var(--surface);
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 1px 12px rgba(30,58,95,0.07), 0 4px 24px rgba(30,58,95,0.04);
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(110deg, var(--blue-light) 0%, #f0f5ff 55%, var(--yellow-soft) 100%);
      border: 1px solid var(--blue-mid);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .header-title h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: -0.01em;
    }
    .header-title p { color: var(--text-sub); font-size: 13px; margin-top: 3px; }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    /* ── Buttons ── */
    .add-btn {
      text-decoration: none;
      background: var(--navy);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      display: inline-block;
      border: 1.5px solid var(--navy);
      transition: background 0.13s;
    }
    .add-btn:hover { background: var(--navy-hover); }

    .notify-all-btn {
      background: var(--yellow-soft);
      color: var(--yellow-dark);
      border: 1.5px solid var(--yellow-mid);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.13s;
    }
    .notify-all-btn:hover { background: var(--yellow-mid); }

    button, .small-link {
      border-radius: 7px;
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.12s;
      border: 1.5px solid transparent;
    }
    .edit-btn           { background: var(--blue-light); color: var(--navy);        border-color: var(--blue-mid); }
    .delete-btn         { background: var(--red-soft);   color: var(--red-dark);    border-color: var(--red-mid); }
    .alert-btn          { background: var(--yellow-soft); color: var(--yellow-dark); border-color: var(--yellow-mid); }
    .comment-btn        { background: var(--navy);        color: #fff;               border-color: var(--navy); padding: 6px 14px; white-space: nowrap; }
    .comment-edit-btn   { background: var(--blue-light);  color: var(--navy);        border-color: var(--blue-mid); padding: 4px 8px; font-size: 11px; }
    .comment-delete-btn { background: var(--red-soft);    color: var(--red-dark);    border-color: var(--red-mid);  padding: 4px 8px; font-size: 11px; }
    button:hover, .small-link:hover { opacity: 0.76; }

    /* ── Section ── */
    .section { margin-bottom: 28px; }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--grey-500);
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    /* ── Dashboard cards ── */
    .dashboard-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .dashboard-card {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 10px;
      cursor: pointer;
      text-align: center;
      background: var(--grey-50);
      transition: 0.14s ease;
    }
    .dashboard-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(30,58,95,0.09); }
    .dashboard-card.active { border-color: var(--blue); background: var(--blue-light); }

    .card-all        { background: var(--grey-100); }
    .card-not-start  { background: var(--grey-200); }
    .card-inprogress { background: var(--blue-light); }
    .card-onhold     { background: var(--yellow-soft); }
    .card-completed  { background: var(--green-soft); }

    .dashboard-title  { font-size: 10px; font-weight: 700; color: var(--grey-500); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .dashboard-number { font-size: 26px; font-weight: 700; color: var(--navy); }

    /* ── Project cards ── */
    .project-list { display: flex; flex-direction: column; gap: 10px; }

    .project-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 2fr 1.5fr 1fr 1.1fr 1.8fr 0.75fr;
      gap: 18px;
      align-items: start;
      transition: box-shadow 0.14s, border-color 0.14s;
    }
    .project-card:hover { box-shadow: 0 3px 14px rgba(30,58,95,0.08); border-color: var(--blue-mid); }

    /* urgency — thin top bar only */
    .project-card.overdue   { border-top: 3px solid var(--red-dark); }
    .project-card.due-today { border-top: 3px solid var(--yellow); }
    .project-card.due-soon  { border-top: 3px solid var(--yellow-mid); }

    .pc-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }
    .pc-value       { font-size: 13px; color: var(--text-main); line-height: 1.5; }
    .pc-value.large { font-size: 14px; font-weight: 700; color: var(--navy); }
    .pc-detail      { font-size: 12px; color: var(--text-sub); margin-top: 4px; line-height: 1.5; }

    .pc-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

    /* ── Comments ── */
    .comment-item {
      background: var(--grey-50);
      border: 1px solid var(--border-soft);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-main);
    }
    .comment-time   { display: block; color: var(--text-muted); font-size: 11px; margin-top: 3px; }
    .comment-edited { display: block; color: var(--text-sub);   font-size: 11px; margin-top: 2px; }
    .comment-action-row { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }

    /* comment done state */
    .comment-item.done {
      background: var(--green-soft);
      border-color: var(--green-mid);
    }
    .comment-done-badge {
      display: inline-block;
      background: var(--green-soft);
      color: var(--green-dark);
      border: 1px solid var(--green-mid);
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .comment-done-date {
      display: block;
      color: var(--green-dark);
      font-size: 11px;
      margin-top: 2px;
    }

    /* comment collapse */
    .comment-list-wrap { }
    .comment-show-more {
      font-size: 12px;
      color: var(--blue);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 0;
      font-weight: 600;
      text-decoration: underline;
      display: block;
      margin-top: 4px;
    }
    .comment-show-more:hover { opacity: 0.75; }

    .done-btn { background: var(--green-soft); color: var(--green-dark); border: 1px solid var(--green-mid); padding: 4px 8px; font-size: 11px; }

    .comment-input-row { display: flex; gap: 8px; margin-top: 8px; align-items: flex-end; }
    .comment-input-row textarea {
      flex: 1;
      min-height: 46px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      background: var(--grey-50);
      color: var(--text-main);
    }
    .comment-input-row textarea:focus { outline: none; border-color: var(--blue); background: #fff; }

    /* ── Status badges ── */
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: 0.03em;
    }
    .status-not-start  { background: var(--grey-200);   color: var(--grey-700);   border: 1px solid var(--grey-300); }
    .status-inprogress { background: var(--blue-light);  color: var(--navy);       border: 1px solid var(--blue-mid); }
    .status-onhold     { background: var(--yellow-soft); color: var(--yellow-dark); border: 1px solid var(--yellow-mid); }
    .status-completed  { background: var(--green-soft);  color: var(--green-dark); border: 1px solid var(--green-mid); }

    /* ── Due badges ── */
    .due-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      margin-top: 3px;
    }
    .due-badge-overdue { background: var(--red-soft);    color: var(--red-dark);    border: 1px solid var(--red-mid); }
    .due-badge-today   { background: var(--yellow-soft); color: var(--yellow-dark); border: 1px solid var(--yellow-mid); }
    .due-badge-soon    { background: var(--yellow-soft); color: var(--yellow-dark); border: 1px solid var(--yellow-mid); }
    .due-badge-ok      { background: var(--green-soft);  color: var(--green-dark);  border: 1px solid var(--green-mid); }
    .due-badge-none    { background: var(--grey-200);    color: var(--grey-500);    border: 1px solid var(--grey-300); }

    /* ── Legend ── */
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; margin-bottom: 12px; color: var(--text-sub); }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot  { width: 12px; height: 3px; border-radius: 2px; }
    .legend-red    { background: var(--red-dark); }
    .legend-yellow { background: var(--yellow); }

    .empty-message  { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
    .status-message { margin-top: 10px; color: var(--text-muted); font-size: 12px; }

    @media (max-width: 1100px) { .project-card { grid-template-columns: 1fr 1fr 1fr; } }
    @media (max-width: 900px)  { .dashboard-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 768px) {
      body { padding: 12px; }
      .container { padding: 14px; }
      .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
      .project-card { grid-template-columns: 1fr 1fr; }
      .add-btn, .notify-all-btn { width: 100%; text-align: center; }
    }
    @media (max-width: 480px) { .project-card { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="header-title">
        <h1>Project Tracker</h1>
        <p>Dashboard for tracking projects and pending tasks</p>
      </div>
      <div class="header-actions">
        <button class="notify-all-btn" onclick="notifyAllDue()">🔔 Alert All</button>
        <a class="add-btn" href="add.html">+ Add Project</a>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="section">
      <div class="section-title">📊 Dashboard</div>
      <div class="dashboard-grid">
        <div class="dashboard-card card-all active" onclick="setFilter('All')" id="card-All">
          <div class="dashboard-title">All</div>
          <div class="dashboard-number" id="count-All">0</div>
        </div>
        <div class="dashboard-card card-not-start" onclick="setFilter('Not Start')" id="card-Not Start">
          <div class="dashboard-title">Not Start</div>
          <div class="dashboard-number" id="count-Not Start">0</div>
        </div>
        <div class="dashboard-card card-inprogress" onclick="setFilter('Inprogress')" id="card-Inprogress">
          <div class="dashboard-title">Inprogress</div>
          <div class="dashboard-number" id="count-Inprogress">0</div>
        </div>
        <div class="dashboard-card card-onhold" onclick="setFilter('Onhold')" id="card-Onhold">
          <div class="dashboard-title">Onhold</div>
          <div class="dashboard-number" id="count-Onhold">0</div>
        </div>
        <div class="dashboard-card card-completed" onclick="setFilter('Completed')" id="card-Completed">
          <div class="dashboard-title">Completed</div>
          <div class="dashboard-number" id="count-Completed">0</div>
        </div>
      </div>
    </div>

    <!-- Project List -->
    <div class="section">
      <div class="section-title">📋 Project List</div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot legend-red"></div> Overdue</div>
        <div class="legend-item"><div class="legend-dot legend-yellow"></div> Due Soon (≤24 hrs)</div>
      </div>

      <div class="project-list" id="projectList">
        <div class="empty-message">Loading data...</div>
      </div>

      <div id="statusMessage" class="status-message"></div>
    </div>

  </div>

  <script type="module">
    import { db, collectionName } from "./firebase.js";
    import {
      collection, getDocs, updateDoc, deleteDoc, doc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    let projects = [];
    let currentFilter = "All";

    // ── LINE / Teams Alert ────────────────────────────────────────────
    async function sendLineMessage(message) {
      const res = await fetch("https://gmc-tracker.muttana-mm.workers.dev", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });
      if (!res.ok) throw new Error(`Alert error ${res.status}`);
      return true;
    }

    function buildMessage(item, hoursLeft) {
      const dueTxt  = item.dueDateText || "-";
      const urgency = hoursLeft <= 0  ? "⚠️ เลยกำหนดแล้ว"
                    : hoursLeft <= 3  ? "🔴 ด่วนมาก!"
                    : hoursLeft <= 24 ? "🟡 ใกล้ถึงกำหนด"
                    :                  "📌 แจ้งเตือนล่วงหน้า";
      const timeText = hoursLeft > 0
        ? `อีก ${Math.round(hoursLeft)} ชม.`
        : `เลยกำหนดมาแล้ว ${Math.abs(Math.round(hoursLeft))} ชม.`;
      const engineers = Array.isArray(item.engineers) && item.engineers.length > 0
        ? item.engineers.join(", ") : (item.engineerName || "-");

      const detailLine = item.detail ? `\n📝 Detail: ${item.detail}` : "";
      return `${urgency}\n📋 Project: ${item.projectName}${detailLine}\n👷 Engineer: ${engineers}\n🏢 Customer: ${item.customer}\n📊 Status: ${item.status}\n📅 Due: ${dueTxt}\n⏰ ${timeText}`;
    }

    window.sendAlertForProject = async function(projectId) {
      const item = projects.find(p => p.id === projectId);
      if (!item) return;
      const btn = document.getElementById(`alert-btn-${projectId}`);
      if (btn) { btn.disabled = true; btn.innerText = "กำลังส่ง..."; }
      const hoursLeft = item.dueDate ? (new Date(item.dueDate) - new Date()) / 3600000 : 0;
      try {
        await sendLineMessage(buildMessage(item, hoursLeft));
        alert(`✅ Alert sent successfully!\n${item.projectName}`);
      } catch (err) {
        alert("❌ Failed to send alert:\n" + err.message);
      } finally {
        if (btn) { btn.disabled = false; btn.innerText = "🔔 Alert"; }
      }
    };

    window.notifyAllDue = async function() {
      const now = new Date();
      const dueItems = projects.filter(item => {
        if (!item.dueDate || item.status === "Completed") return false;
        return (new Date(item.dueDate) - now) / 3600000 <= (item.notifyBeforeHours || 24);
      });
      if (dueItems.length === 0) { alert("No projects are due for an alert at this time."); return; }
      if (!confirm(`Send alert for ${dueItems.length} project(s)?`)) return;
      setStatus("Sending alerts...");
      let success = 0;
      for (const item of dueItems) {
        const h = (new Date(item.dueDate) - now) / 3600000;
        try { await sendLineMessage(buildMessage(item, h)); success++; }
        catch (e) { console.error("alert failed:", item.projectName, e); }
      }
      setStatus(`Alert sent ${success}/${dueItems.length} successfully`);
      alert(`✅ Alert sent ${success}/${dueItems.length} successfully`);
    };

    function autoCheckNotifications() {
      const now = new Date();
      projects.forEach(async item => {
        if (!item.dueDate || item.status === "Completed" || item.notified) return;
        const h = (new Date(item.dueDate) - now) / 3600000;
        if (h <= (item.notifyBeforeHours || 24) && h > -72) {
          try {
            await sendLineMessage(buildMessage(item, h));
            await updateDoc(doc(db, collectionName, item.id), { notified: true });
          } catch (e) { console.warn("auto-alert failed:", item.projectName); }
        }
      });
    }

    // ── Load ──────────────────────────────────────────────────────────
    async function loadProjects() {
      setStatus("Loading...");
      try {
        const snap = await getDocs(collection(db, collectionName));
        projects = [];
        snap.forEach(d => projects.push({ id: d.id, ...d.data() }));
        projects.sort((a, b) => {
          const aH = !!a.dueDate, bH = !!b.dueDate;
          if (aH && bH) return new Date(a.dueDate) - new Date(b.dueDate);
          if (aH) return -1; if (bH) return 1;
          return (b.updatedTimeText || "").localeCompare(a.updatedTimeText || "");
        });
        updateDashboard();
        renderList();
        setStatus("");
        setTimeout(autoCheckNotifications, 1000);
      } catch (err) {
        console.error(err);
        setStatus("Cannot load data from Firebase.");
        document.getElementById("projectList").innerHTML =
          `<div class="empty-message">Cannot load data from Firebase</div>`;
      }
    }

    // ── Urgency ───────────────────────────────────────────────────────
    function getUrgencyClass(dueDate, status) {
      if (!dueDate || status === "Completed") return "";
      const h = (new Date(dueDate) - new Date()) / 3600000;
      return h < 0 ? "overdue" : h <= 8 ? "due-today" : h <= 24 ? "due-soon" : "";
    }

    function getDueBadge(dueDate, dueDateText, status) {
      if (!dueDate) return `<span class="due-badge due-badge-none">ไม่ระบุ</span>`;
      const display = dueDateText || new Date(dueDate).toLocaleString("en-GB", {
        year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"
      });
      if (status === "Completed") return `
        <div style="font-size:12px;color:var(--text-sub)">${escapeHtml(display)}</div>
        <span class="due-badge due-badge-ok">✅ Completed</span>`;
      const h = (new Date(dueDate) - new Date()) / 3600000;
      let cls, label;
      if (h < 0)        { cls="due-badge-overdue"; label=`⛔ Overdue ${Math.abs(Math.round(h))} hrs`; }
      else if (h <= 8)  { cls="due-badge-today";   label=`🔴 ${Math.round(h)} hrs left`; }
      else if (h <= 24) { cls="due-badge-soon";    label=`🟡 ${Math.round(h)} hrs left`; }
      else              { cls="due-badge-ok";      label=`🟢 ${Math.floor(h/24)} days left`; }
      return `
        <div style="font-size:13px;color:#374151;margin-bottom:3px">${escapeHtml(display)}</div>
        <span class="due-badge ${cls}">${label}</span>`;
    }

    // ── Render card list ──────────────────────────────────────────────
    function renderList() {
      const container = document.getElementById("projectList");
      container.innerHTML = "";

      const list = currentFilter === "All"
        ? projects
        : projects.filter(p => p.status === currentFilter);

      if (list.length === 0) {
        container.innerHTML = `<div class="empty-message">ไม่พบข้อมูลในสถานะนี้</div>`;
        return;
      }

      list.forEach((item, index) => {
        const comments = Array.isArray(item.comments) ? item.comments : [];
        const cid      = `comment-${item.id}`;
        const urg      = getUrgencyClass(item.dueDate, item.status);

        const engineers = Array.isArray(item.engineers) && item.engineers.length > 0
          ? item.engineers
          : (item.engineerName ? item.engineerName.split(",").map(s => s.trim()) : ["-"]);

        const engineerHtml = engineers.map(n =>
          `<span style="display:inline-block;background:var(--blue-light);color:var(--navy);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin:2px 3px 2px 0">${escapeHtml(n)}</span>`
        ).join("");

        const commentHtml = buildCommentHtml(comments, item.id);

        const card = document.createElement("div");
        card.className = `project-card ${urg}`;
        card.innerHTML = `
          <!-- Col 1: Project -->
          <div>
            <div class="pc-label">Project / Task / PM</div>
            ${item.projectType ? `<span style="display:inline-block;background:var(--blue-light);color:var(--navy);border:1px solid var(--blue-mid);border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;margin-bottom:5px">${escapeHtml(item.projectType)}</span>` : ""}
            <div class="pc-value large">${escapeHtml(item.projectName || "")}</div>
            ${item.detail ? `<div class="pc-detail">${escapeHtml(item.detail)}</div>` : ""}
            <div style="margin-top:6px">${getStatusBadge(item.status || "")}</div>
          </div>

          <!-- Col 2: Engineer / Customer -->
          <div>
            <div class="pc-label">Engineer</div>
            <div class="pc-value" style="margin-bottom:10px">${engineerHtml}</div>
            <div class="pc-label">Customer</div>
            <div class="pc-value">${escapeHtml(item.customer || "")}</div>
          </div>

          <!-- Col 3: Due Date -->
          <div>
            <div class="pc-label">Due Date</div>
            <div class="pc-value">${getDueBadge(item.dueDate, item.dueDateText, item.status)}</div>
          </div>

          <!-- Col 4: Updated -->
          <div>
            <div class="pc-label">Updated</div>
            <div class="pc-value" style="font-size:12px;color:var(--text-sub)">${escapeHtml(item.updatedTimeText || "")}</div>
          </div>

          <!-- Col 5: Comments -->
          <div>
            <div class="pc-label">Comments <span style="color:var(--text-muted);font-weight:400">(${comments.length})</span></div>
            <div class="comment-list-wrap" id="clist-${item.id}">${commentHtml}</div>
            <div class="comment-input-row">
              <textarea id="${cid}" placeholder="Add comment..."></textarea>
              <button class="comment-btn" onclick="addComment('${item.id}','${cid}')">+ Add</button>
            </div>
          </div>

          <!-- Col 6: Actions -->
          <div class="pc-actions">
            <a class="small-link edit-btn" href="add.html?id=${item.id}">✏️ Edit</a>
            <button id="alert-btn-${item.id}" class="alert-btn" onclick="sendAlertForProject('${item.id}')">🔔 Alert</button>
            <button class="delete-btn" onclick="deleteProject('${item.id}')">🗑️ Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ── Dashboard ─────────────────────────────────────────────────────
    function updateDashboard() {
      ["All","Not Start","Inprogress","Onhold","Completed"].forEach(s => {
        const count = s === "All" ? projects.length : projects.filter(p => p.status === s).length;
        const el = document.getElementById(`count-${s}`);
        if (el) el.innerText = count;
      });
    }

    function setFilter(status) {
      currentFilter = status;
      ["All","Not Start","Inprogress","Onhold","Completed"].forEach(s => {
        const c = document.getElementById(`card-${s}`);
        if (c) c.classList.remove("active");
      });
      const a = document.getElementById(`card-${status}`);
      if (a) a.classList.add("active");
      renderList();
    }

    // ── Build comment HTML ────────────────────────────────────────────
    function buildCommentHtml(comments, projectId) {
      if (comments.length === 0)
        return `<div style="color:var(--text-muted);font-size:13px;padding:4px 0">No comments yet</div>`;

      const SHOW = 2; // show first N comments collapsed
      const items = comments.map((c, ci) => {
        const isDone    = !!c.doneAt;
        const doneHtml  = isDone
          ? `<span class="comment-done-badge">✅ Done</span><span class="comment-done-date">Completed: ${escapeHtml(c.doneAt)}</span>`
          : "";
        const editedHtml = c.editedAtText
          ? `<span class="comment-edited">Edited: ${escapeHtml(c.editedAtText)}</span>`
          : "";

        return `<div class="comment-item${isDone ? " done" : ""}" id="ci-${projectId}-${ci}">
          <div style="font-size:13px;line-height:1.5">${escapeHtml(c.text || "")}${doneHtml}</div>
          <span class="comment-time">Added: ${escapeHtml(c.createdAtText || "")}</span>
          ${editedHtml}
          ${isDone ? `<span class="comment-done-date">Completed: ${escapeHtml(c.doneAt)}</span>` : ""}
          <div class="comment-action-row">
            ${!isDone ? `<button class="done-btn" onclick="markCommentDone('${projectId}',${ci})">✅ Done</button>` : ""}
            <button class="comment-edit-btn" onclick="editComment('${projectId}',${ci})">Edit</button>
            <button class="comment-delete-btn" onclick="deleteComment('${projectId}',${ci})">Delete</button>
          </div>
        </div>`;
      });

      if (comments.length <= SHOW) return items.join("");

      // collapse: show first SHOW, hide rest
      const visible = items.slice(0, SHOW).join("");
      const hidden  = items.slice(SHOW).join("");
      const more    = comments.length - SHOW;

      return `${visible}
        <div id="more-${projectId}" style="display:none">${hidden}</div>
        <button class="comment-show-more" id="toggle-${projectId}"
          onclick="toggleComments('${projectId}')">
          ▼ Show ${more} more comment(s)
        </button>`;
    }

    window.toggleComments = function(projectId) {
      const more   = document.getElementById(`more-${projectId}`);
      const btn    = document.getElementById(`toggle-${projectId}`);
      const hidden = more.style.display === "none";
      more.style.display = hidden ? "block" : "none";
      btn.innerText = hidden
        ? "▲ Show less"
        : `▼ Show ${more.children.length} more comment(s)`;
    };

    // ── Comments CRUD ─────────────────────────────────────────────────
    async function addComment(projectId, textareaId) {
      const textarea = document.getElementById(textareaId);
      const text     = textarea.value.trim();
      if (!text) { alert("Please enter a comment first."); return; }
      const item = projects.find(p => p.id === projectId); if (!item) return;
      const now  = getCurrentTimeText();
      const updated = [...(Array.isArray(item.comments) ? item.comments : []), {
        text, createdAtText: now, doneAt: null
      }];
      try {
        await updateDoc(doc(db, collectionName, projectId), { comments: updated, updatedTimeText: now, updatedAt: serverTimestamp() });
        textarea.value = ""; setStatus("Comment added."); await loadProjects();
      } catch (e) { alert("Failed to add comment."); }
    }

    window.markCommentDone = async function(projectId, ci) {
      const item = projects.find(p => p.id === projectId); if (!item) return;
      const comments = Array.isArray(item.comments) ? item.comments : [];
      const now      = getCurrentTimeText();
      const updated  = comments.map((c, i) => i === ci ? { ...c, doneAt: now } : c);
      try {
        await updateDoc(doc(db, collectionName, projectId), { comments: updated, updatedTimeText: now, updatedAt: serverTimestamp() });
        setStatus("Comment marked as done."); await loadProjects();
      } catch (e) { alert("Failed to mark comment as done."); }
    };

    async function editComment(projectId, ci) {
      const item = projects.find(p => p.id === projectId); if (!item) return;
      const comments = Array.isArray(item.comments) ? item.comments : [];
      const newText  = prompt("Edit comment:", comments[ci]?.text || "");
      if (newText === null) return;
      const trimmed = newText.trim(); if (!trimmed) { alert("Comment cannot be empty."); return; }
      const now     = getCurrentTimeText();
      const updated = comments.map((c, i) => i === ci ? { ...c, text: trimmed, editedAtText: now } : c);
      try {
        await updateDoc(doc(db, collectionName, projectId), { comments: updated, updatedTimeText: now, updatedAt: serverTimestamp() });
        setStatus("Comment updated."); await loadProjects();
      } catch (e) { alert("Failed to edit comment."); }
    }

    async function deleteComment(projectId, ci) {
      const item = projects.find(p => p.id === projectId); if (!item) return;
      if (!confirm("Delete this comment?")) return;
      const comments = Array.isArray(item.comments) ? item.comments : [];
      const now      = getCurrentTimeText();
      const updated  = comments.filter((_, i) => i !== ci);
      try {
        await updateDoc(doc(db, collectionName, projectId), { comments: updated, updatedTimeText: now, updatedAt: serverTimestamp() });
        setStatus("Comment deleted."); await loadProjects();
      } catch (e) { alert("Failed to delete comment."); }
    }

    async function deleteProject(projectId) {
      if (!confirm("Delete this project?")) return;
      try {
        await deleteDoc(doc(db, collectionName, projectId));
        setStatus("Project deleted."); await loadProjects();
      } catch (e) { alert("Failed to delete project."); }
    }

    // ── Helpers ───────────────────────────────────────────────────────
    function getStatusBadge(s) {
      const map = { "Not Start":"status-not-start", "Inprogress":"status-inprogress", "Onhold":"status-onhold", "Completed":"status-completed" };
      return `<span class="status-badge ${map[s]||''}">${escapeHtml(s)}</span>`;
    }

    function getCurrentTimeText() {
      return new Date().toLocaleString("en-GB", { year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
    }

    function setStatus(msg) { document.getElementById("statusMessage").innerText = msg; }

    function escapeHtml(v) {
      return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    window.setFilter     = setFilter;
    window.addComment    = addComment;
    window.editComment   = editComment;
    window.deleteComment = deleteComment;
    window.deleteProject = deleteProject;
    window.buildCommentHtml = buildCommentHtml;

    loadProjects();
  </script>
</body>
</html>
